<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Seguridad App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Crear una Cuenta</h1>
                <p>Ingresa tus datos para registrarte en el sistema</p>
            </div>
            
            <div id="alert-box"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Nombre Completo</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" required minlength="5">
                </div>
                <button type="submit" class="btn">Registrarse</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem;"><a href="index.html" style="color: var(--primary-color); text-decoration: none; font-size: 0.9rem;">¿Ya tienes cuenta? Inicia sesión aquí</a></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const btn = e.target.querySelector('button');
            const alertBox = document.getElementById('alert-box');

            btn.disabled = true;
            btn.textContent = 'Registrando...';
            alertBox.style.display = 'none';

            try {
                const response = await API.request('/register', 'POST', { name, email, password });
                alertBox.className = 'alert-success';
                alertBox.textContent = response.message;
                alertBox.style.display = 'block';
                
                // Redirigir al login despues de 2 segundos
                setTimeout(() => window.location.href = 'index.html', 2000);
            } catch (err) {
                alertBox.className = 'alert-error';
                alertBox.textContent = err.message;
                alertBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Registrarse';
            }
        });
    </script>
</body>
</html>
