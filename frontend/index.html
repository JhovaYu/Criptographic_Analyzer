<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Seguridad App</title>
    <meta name="description" content="Portal de inicio de sesión de la aplicación de seguridad">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Bienvenido de nuevo</h1>
                <p>Ingresa tus credenciales para acceder</p>
            </div>
            
            <div id="alert-box"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn">Iniciar Sesión</button>
            </form>
            <p style="text-align: center; margin-top: 1rem;">
                <a href="forgot.html" style="color: var(--primary-color); text-decoration: none; font-size: 0.9rem;">¿Olvidaste tu contraseña?</a>
                <br><br>
                <a href="register.html" style="color: var(--primary-color); text-decoration: none; font-size: 0.9rem;">¿No tienes cuenta? Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert-box');
            const btn = document.querySelector('.btn');

            btn.disabled = true;
            btn.textContent = 'Autenticando...';
            alertBox.style.display = 'none';

            try {
                const response = await API.request('/login', 'POST', { email, password });
                
                // Guardar token y redirigir
                API.setToken(response.token);
                
                // Aquí, de forma simple, decodificamos el payload para ver roles (aunque la validación real es en el backend)
                const payloadStr = response.token.split('.')[1];
                const payload = JSON.parse(atob(payloadStr.replace(/-/g, '+').replace(/_/g, '/')));
                
                if (payload.roles && payload.roles.includes('Administrador')) {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'content.html';
                }
            } catch (err) {
                alertBox.className = 'alert-error';
                alertBox.textContent = err.message;
                alertBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
